services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    environment:
      ACCEPT_EULA: Y
      MSSQL_SA_PASSWORD: ${SQL_PASSWORD:?Set SQL_PASSWORD in .env}
    ports:
      - "127.0.0.1:14333:1433"
    volumes:
      - stockflow-db:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
  app:
    build: .
    ports:
      - "127.0.0.1:5080:8080"
    environment:
      ConnectionStrings__Database: Server=db;Database=StockFlow;User Id=sa;Password=${SQL_PASSWORD};TrustServerCertificate=True
      InitializeDatabase: "true"
      Seed__SampleData: "true"
      Seed__AdminPassword: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      Seed__StaffPassword: ${STAFF_PASSWORD:?Set STAFF_PASSWORD in .env}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - stockflow-keys:/home/app/.aspnet/DataProtection-Keys
volumes:
  stockflow-db:
  stockflow-keys:
