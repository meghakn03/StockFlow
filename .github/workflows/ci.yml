name: Build and SQL Server integration tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      sql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: Test_SQL_Server_2026!
        ports: [1433:1433]
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Test_SQL_Server_2026!' -C -Q 'SELECT 1' -b -o /dev/null"
          --health-interval 10s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test tests/StockFlow.Tests -c Release --logger trx --results-directory TestResults
        env:
          TEST_SQL_CONNECTION: Server=localhost;User Id=sa;Password=Test_SQL_Server_2026!;TrustServerCertificate=True
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: TestResults
